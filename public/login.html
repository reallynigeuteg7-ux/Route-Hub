<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteHub — Авторизация</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="log.css">
    <link rel="stylesheet" href="email-code-modal.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-card">
                <div class="logo-area">
                    <a href="./index.html">
                    <img src="../images/logo2.png" alt="logo" class="logo">
                    </a>
                    <span class="logo-name">RouteHub</span>
                </div>

                <h2 id="card-title">Вход в аккаунт</h2>
                <p class="switch-mode" id="toggle-text">Нет аккаунта? <a href="#" id="toggle-register">Регистрация</a></p>

                <form id="login-form" class="auth-form">
                    <input id="login-email" type="email" placeholder="Email" required>
                    <input id="login-password" type="password" placeholder="Пароль" required>
                    <input type="hidden" id="csrf" name="csrf">
                    <button type="submit" class="btn-start">Войти</button>
                    <a href="forgot-password.html" id="forgot" style="display: block; margin-top: 15px; font-size: 13px; color: #666; text-decoration: none;">Забыли пароль?</a>
                </form>

                <form id="register-form" class="auth-form" style="display:none;">
                    <input id="reg-name" type="text" placeholder="Имя или Название компании" required>
                    <input id="reg-email" type="email" placeholder="Email" required>
                    <input id="reg-password" type="password" placeholder="Пароль" required>
                    <input id="reg-phone" type="tel" placeholder="+7 (___) ___-__-__" required>
                    <select id="reg-person-type" required style="width: 100%; background: #f0f0e8; border: none; border-radius: 15px; padding: 16px 18px; margin-bottom: 12px; font-size: 15px; outline: none; font-family: inherit;">
                        <option value="individual">Физлицо</option>
                        <option value="self_employed">Самозанятый</option>
                        <option value="ip">ИП</option>
                        <option value="too">ТОО</option>
                    </select>
                    <select id="reg-role" style="width: 100%; background: #f0f0e8; border: none; border-radius: 15px; padding: 16px 18px; margin-bottom: 12px; font-size: 15px; outline: none; font-family: inherit;">
                        <option value="client">Я Грузовладелец</option>
                        <option value="carrier">Я Перевозчик</option>
                    </select>
                    <label class="agree-row">
  <input id="reg-agree" type="checkbox" required>
  <span>
    Я согласен(на) с
    <a href="terms.html" target="_blank" rel="noopener">условиями</a>
    и
    <a href="privacy.html" target="_blank" rel="noopener">политикой конфиденциальности</a>
  </span>
</label>

                    <button id="reg-submit" type="submit" class="btn-start">Зарегистрироваться</button>
                </form>

                <div id="msg" style="margin-top:12px; color:#ff4d4d; font-size: 13px;"></div>
            </div>

            <div class="auth-visual">
                <h2 class="bigfo">ROUTEHUB</h2>
            </div>
        </div>
    </div>

    <div id="email-code-modal" class="code-modal" hidden>
        <button id="code-modal-backdrop" class="code-modal__backdrop" type="button" aria-label="Закрыть окно"></button>
        <section class="code-modal__panel" role="dialog" aria-modal="true" aria-labelledby="code-modal-title" aria-describedby="code-modal-description">
            <button id="code-modal-close" class="code-modal__close" type="button" aria-label="Закрыть">&times;</button>
            <div class="code-modal__icon" aria-hidden="true">✉</div>
            <h2 id="code-modal-title">Подтвердите email</h2>
            <p id="code-modal-description" class="code-modal__description">
                Введите шестизначный код, отправленный на <strong id="code-email"></strong>
            </p>
            <form id="email-code-form" class="code-modal__form">
                <input id="reg-email-code" class="code-modal__input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="Код подтверждения" required>
                <div id="code-msg" class="code-modal__message" aria-live="polite"></div>
                <button id="code-confirm" type="submit" class="btn-start">Подтвердить и зарегистрироваться</button>
                <button id="code-resend" type="button" class="code-modal__resend">Отправить код повторно</button>
            </form>
        </section>
    </div>

    <script src="loginscript.js"></script>
</body>
</html>
