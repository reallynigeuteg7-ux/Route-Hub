<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteHub — Восстановление пароля</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #17304e 0%, #081120 55%, #040913 100%);
      color: #f4f8ff;
      font-family: 'Montserrat', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: rgba(244, 248, 255, 0.8);
    }

    .form-block + .form-block {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      border: none;
      padding: 14px 16px;
      font: inherit;
      margin-top: 12px;
    }

    input {
      background: rgba(255, 255, 255, 0.92);
      color: #081120;
    }

    button {
      cursor: pointer;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      font-weight: 700;
    }

    .msg {
      min-height: 20px;
      margin-top: 12px;
      font-size: 14px;
    }

    .ok {
      color: #4ade80;
    }

    .error {
      color: #fca5a5;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #7dd3fc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Восстановление пароля</h1>
    <p>Сначала отправьте код на почту, затем введите код и новый пароль.</p>

    <div class="form-block">
      <h2>Шаг 1. Получить код</h2>
      <input id="emailRequest" type="email" placeholder="Email">
      <button id="sendCodeBtn" type="button">Отправить код</button>
      <div class="msg" id="requestMsg"></div>
    </div>

    <div class="form-block">
      <h2>Шаг 2. Задать новый пароль</h2>
      <input id="emailReset" type="email" placeholder="Email">
      <input id="codeReset" type="text" placeholder="Код из письма">
      <input id="passwordReset" type="password" placeholder="Новый пароль">
      <button id="resetBtn" type="button">Сменить пароль</button>
      <div class="msg" id="resetMsg"></div>
    </div>

    <a class="back" href="/login.html">← Вернуться ко входу</a>
  </div>

  <script>
    const requestMsg = document.getElementById('requestMsg');
    const resetMsg = document.getElementById('resetMsg');

    function showMessage(element, text, ok = false) {
      element.textContent = text;
      element.className = `msg ${ok ? 'ok' : 'error'}`;
    }

    document.getElementById('sendCodeBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailRequest').value.trim();
      if (!email) {
        showMessage(requestMsg, 'Введите email');
        return;
      }

      showMessage(requestMsg, 'Отправка...');

      try {
        const response = await fetch('/api/mobile/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          showMessage(requestMsg, data.error || 'Не удалось отправить код');
          return;
        }

        document.getElementById('emailReset').value = email;
        showMessage(requestMsg, 'Код отправлен на почту', true);
      } catch (error) {
        showMessage(requestMsg, 'Ошибка сети: ' + error.message);
      }
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailReset').value.trim();
      const code = document.getElementById('codeReset').value.trim();
      const newPassword = document.getElementById('passwordReset').value;

      if (!email || !code || !newPassword) {
        showMessage(resetMsg, 'Заполните все поля');
        return;
      }

      showMessage(resetMsg, 'Сохраняем...');

      try {
        const response = await fetch('/api/mobile/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, newPassword })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          showMessage(resetMsg, data.error || 'Не удалось сменить пароль');
          return;
        }

        showMessage(resetMsg, 'Пароль обновлён. Можно входить.', true);
      } catch (error) {
        showMessage(resetMsg, 'Ошибка сети: ' + error.message);
      }
    });
  </script>
</body>
</html>
