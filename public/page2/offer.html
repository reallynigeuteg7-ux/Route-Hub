<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Предложить ставку — RouteHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style-card.css">
  <style>
  :root{
    --bg: #0b1220;
    --card: rgba(17, 24, 39, 0.88);
    --card-2: rgba(255,255,255,0.04);
    --line: rgba(255,255,255,0.10);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #22c55e;
    --shadow-lg: 0 20px 45px rgba(0,0,0,0.28);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: Montserrat, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(34,197,94,0.12), transparent 30%),
      radial-gradient(circle at top right, rgba(59,130,246,0.10), transparent 26%),
      linear-gradient(180deg, #08111f 0%, #0b1220 100%);
  }

  .container {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 42px;
  }

  .back-link {
    margin-bottom: 18px;
  }

  .back-link a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 600;
    transition: 0.2s ease;
  }

  .back-link a:hover {
    color: #fff;
    transform: translateX(-2px);
  }

  .offer-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 24px;
    align-items: start;
  }

  .offer-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .offer-card h2,
  .offer-card h3 {
    margin: 0;
    line-height: 1.2;
  }

  .muted {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  #loadLine,
  #loadMeta {
    word-break: break-word;
  }

  form {
    margin-top: 18px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 7px;
  }

  input,
  textarea,
  select {
    width: 100%;
    min-width: 0;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--text);
    outline: none;
    font-family: inherit;
    font-size: 14px;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  input::placeholder,
  textarea::placeholder {
    color: #7c8aa0;
  }

  input:focus,
  textarea:focus,
  select:focus {
    border-color: rgba(34,197,94,0.55);
    box-shadow: 0 0 0 4px rgba(34,197,94,0.10);
    background: rgba(255,255,255,0.05);
  }

  input[type="date"],
  select {
    appearance: none;
  }

  textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  .btnwide {
    width: 100%;
  }

  .btn,
  button.btn,
  .btn-primary,
  .btn-outline {
    min-height: 48px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
  }

  .btn:hover,
  button:hover {
    transform: translateY(-1px);
  }

  .btn-primary {
    box-shadow: 0 10px 24px rgba(34,197,94,0.18);
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.45;
  }

  #status {
    min-height: 22px;
    font-size: 14px;
    line-height: 1.4;
  }

  .ok { color: #22c55e; font-weight: 700; }
  .err { color: #ef4444; font-weight: 700; }

  .offer-card + .offer-card {
    position: sticky;
    top: 20px;
  }

  @media (max-width: 980px) {
    .offer-wrap {
      grid-template-columns: 1fr;
    }

    .offer-card + .offer-card {
      position: static;
      top: auto;
    }
  }

  @media (max-width: 640px) {
    .container {
      width: min(100% - 20px, 100%);
      padding: 18px 0 28px;
    }

    .offer-card {
      padding: 18px;
      border-radius: 18px;
    }

    .row {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    input,
    textarea,
    select {
      padding: 12px 13px;
      border-radius: 12px;
      font-size: 14px;
    }

    .btn,
    button.btn,
    .btn-primary,
    .btn-outline {
      min-height: 46px;
    }
  }
</style>
</head>

<body>
   <div class="container">
    <div class="back-link">
      <a id="backToCard" href="card.html"><span>←</span> Назад к грузу</a>
    </div>

    <div class="offer-wrap">
      <main class="offer-card">
        <h2 style="margin:0 0 8px;">Предложить ставку</h2>
        <div class="muted" id="loadLine">Загрузка груза...</div>

        <div style="height:18px;"></div>

        <form id="offerForm">
          <div class="row">
            <div>
              <label id="priceLabel">Сумма (₸)</label>
              <input id="price" type="number" min="0" step="1000" placeholder="Например: 250000" required />
            </div>
            <div>
              <label>Валюта</label>
              <select id="currency">
                <option value="KZT">KZT</option>
                <option value="SOL">SOL (Solana)</option>
              </select>
            </div>
          </div>

          <div style="height:12px;"></div>

          <div class="row">
            <div>
              <label>Дата подачи машины</label>
              <input id="pickupDate" type="date" />
            </div>
            <div>
              <label>Тип машины</label>
              <input id="truckType" type="text" placeholder="Тент / Реф / Борт..." />
            </div>
          </div>

          <div style="height:12px;"></div>

          <label>Комментарий</label>
          <textarea id="comment" placeholder="Например: готов выехать сегодня, есть 2 водителя, страховка есть..."></textarea>

          <div style="height:14px;"></div>

          <button class="btn btn-primary btnwide" type="submit">Отправить ставку</button>
          <div class="hint">Ставка отправится заказчику через RouteHub.</div>

          <div id="status" style="margin-top:12px;"></div>
        </form>
      </main>

      <aside class="offer-card">
        <h3 style="margin:0 0 10px;">Данные груза</h3>
        <div class="muted" id="loadMeta">—</div>

        <div style="height:12px;"></div>

        <button id="goChat" class="btn btn-outline btnwide" type="button">Чат отключен</button>
        <div class="hint">Сначала отправьте ставку. Заказчик увидит ее в системе.</div>
      </aside>
    </div>
  </div>

  <script src="offer.js?v=20260819-1"></script>
</body>
</html>
