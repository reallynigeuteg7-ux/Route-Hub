<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#1055;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100; &#1091;&#1095;&#1072;&#1089;&#1090;&#1085;&#1080;&#1082;&#1072; | RouteHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg:#07101d;--panel:#0b1424;--line:rgba(148,163,184,.18);--text:#f8fafc;--muted:#94a3b8;--blue:#2f86f6;--green:#22c55e;--amber:#f59e0b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Montserrat,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 78% 10%,rgba(47,134,246,.20),transparent 30%),linear-gradient(180deg,#050b14 0%,#081120 100%)}
    .wrap{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:30px 0 46px}
    .back{display:inline-flex;gap:8px;align-items:center;color:var(--muted);text-decoration:none;font-weight:800;margin-bottom:22px}
    .back:hover{color:#fff}
    .grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px}
    .card{background:rgba(11,20,36,.88);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.32);padding:24px}
    .hero{text-align:center}.avatar{width:116px;height:116px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--blue));font-size:46px;font-weight:900;box-shadow:0 18px 36px rgba(47,134,246,.22)}
    h1{margin:0;font-size:30px;line-height:1.1}.role{display:inline-flex;margin-top:10px;padding:7px 13px;border-radius:999px;background:rgba(47,134,246,.14);border:1px solid rgba(47,134,246,.26);color:#93c5fd;font-size:13px;font-weight:800}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.stat{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat strong{font-size:24px}.rating{color:var(--amber)}
    .info{display:grid;gap:12px}.info-row{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;padding:15px}.info-row small{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.info-row strong{font-size:16px;word-break:break-word}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;font-size:20px}
    .reviews{display:grid;gap:12px}.review{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;padding:16px}.review-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.review-author{font-weight:800}.review-route{color:#93c5fd;font-size:12px;margin-top:5px}.review-text{color:#cbd5e1;margin:10px 0 0;line-height:1.55}.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:18px}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding-top:18px}.card{padding:20px}}@media(max-width:460px){.stats{grid-template-columns:1fr}h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i> &#1053;&#1072;&#1079;&#1072;&#1076;</a>
    <div class="grid">
      <aside class="card hero">
        <div class="avatar" id="avatar">--</div>
        <h1 id="profileName">&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1082;&#1072;...</h1>
        <div class="role" id="profileRole">&#1059;&#1095;&#1072;&#1089;&#1090;&#1085;&#1080;&#1082; RouteHub</div>
        <div class="stats">
          <div class="stat"><small>&#1056;&#1077;&#1081;&#1090;&#1080;&#1085;&#1075;</small><strong class="rating"><i class="fa-solid fa-star"></i> <span id="rating">--</span></strong></div>
          <div class="stat"><small>&#1054;&#1090;&#1079;&#1099;&#1074;&#1099;</small><strong id="reviewsCount">0</strong></div>
          <div class="stat"><small>&#1040;&#1082;&#1090;&#1080;&#1074;&#1085;&#1099;&#1077; &#1075;&#1088;&#1091;&#1079;&#1099;</small><strong id="activeLoads">0</strong></div>
          <div class="stat"><small>&#1047;&#1072;&#1074;&#1077;&#1088;&#1096;&#1077;&#1085;&#1086;</small><strong id="completedLoads">0</strong></div>
        </div>
      </aside>
      <main>
        <section class="card info" style="margin-bottom:22px">
          <h2 class="section-title">&#1048;&#1085;&#1092;&#1086;&#1088;&#1084;&#1072;&#1094;&#1080;&#1103;</h2>
          <div class="info-row"><small>&#1050;&#1086;&#1084;&#1087;&#1072;&#1085;&#1080;&#1103;</small><strong id="company">&#1053;&#1077; &#1091;&#1082;&#1072;&#1079;&#1072;&#1085;&#1086;</strong></div>
          <div class="info-row"><small>&#1058;&#1077;&#1083;&#1077;&#1092;&#1086;&#1085;</small><strong id="phone">&#1053;&#1077; &#1091;&#1082;&#1072;&#1079;&#1072;&#1085;</strong></div>
          <div class="info-row"><small>&#1050;&#1086;&#1076; &#1087;&#1086;&#1083;&#1100;&#1079;&#1086;&#1074;&#1072;&#1090;&#1077;&#1083;&#1103;</small><strong id="userCode">000000</strong></div>
          <div class="info-row"><small>&#1048;&#1048;&#1053;</small><strong id="iin">&#1053;&#1077; &#1091;&#1082;&#1072;&#1079;&#1072;&#1085;</strong></div>
          <div class="info-row"><small>&#1057;&#1090;&#1072;&#1090;&#1091;&#1089; &#1069;&#1062;&#1055;</small><strong id="ecp">&#1053;&#1077; &#1074;&#1077;&#1088;&#1080;&#1092;&#1080;&#1094;&#1080;&#1088;&#1086;&#1074;&#1072;&#1085;</strong></div>
        </section>
        <section class="card">
          <h2 class="section-title"><span>&#1054;&#1090;&#1079;&#1099;&#1074;&#1099;</span><span id="reviewsBadge" class="role">0</span></h2>
          <div class="reviews" id="reviewsList"><div class="empty">&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1082;&#1072; &#1086;&#1090;&#1079;&#1099;&#1074;&#1086;&#1074;...</div></div>
        </section>
      </main>
    </div>
  </div>
<script>
function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

function formatRating(value) {
  const n = Number(value || 0);
  if (!Number.isFinite(n) || n <= 0) return '--';
  return n.toFixed(2).replace(/\.00$/, '.0');
}

function roleText(role) {
  const raw = String(role || '').toLowerCase();
  return raw === 'carrier' || raw.includes('\u043f\u0435\u0440\u0435\u0432\u043e\u0437') ? '\u041f\u0435\u0440\u0435\u0432\u043e\u0437\u0447\u0438\u043a' : '\u0417\u0430\u043a\u0430\u0437\u0447\u0438\u043a';
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleDateString('ru-RU');
}

async function initUserProfile() {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');
  const reviewsList = document.getElementById('reviewsList');

  if (!userId) {
    if (reviewsList) reviewsList.innerHTML = '<div class="empty">\u041f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c \u043d\u0435 \u0432\u044b\u0431\u0440\u0430\u043d</div>';
    return;
  }

  try {
    const response = await fetch('/api/users/' + encodeURIComponent(userId) + '/public', { credentials: 'include' });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || '\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043f\u0440\u043e\u0444\u0438\u043b\u044c');

    const name = data.name || data.company || '\u041f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c';
    setText('profileName', name);
    setText('profileRole', roleText(data.role));
    setText('avatar', name.charAt(0).toUpperCase());
    setText('rating', formatRating(data.averageRating));
    setText('reviewsCount', Number(data.totalReviews || 0).toLocaleString('ru-RU'));
    setText('reviewsBadge', Number(data.totalReviews || 0).toLocaleString('ru-RU'));
    setText('activeLoads', Number(data.activeLoads || 0).toLocaleString('ru-RU'));
    setText('completedLoads', Number(data.completedLoads || 0).toLocaleString('ru-RU'));
    setText('company', data.company || '\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u043e');
    setText('phone', data.phone || '\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d');
    setText('userCode', data.user_code || '000000');
    const fallbackIin = params.get('iin') || '';
    const profileIin = data.iin || data.client_iin || data.iinBin || data.iin_bin || data.bin || fallbackIin;
    setText('iin', profileIin || '\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d');
    setText('ecp', data.ecp_verified ? '\u0412\u0435\u0440\u0438\u0444\u0438\u0446\u0438\u0440\u043e\u0432\u0430\u043d' : '\u041d\u0435 \u0432\u0435\u0440\u0438\u0444\u0438\u0446\u0438\u0440\u043e\u0432\u0430\u043d');

    const reviews = Array.isArray(data.reviews) ? data.reviews : [];
    if (!reviews.length) {
      if (reviewsList) reviewsList.innerHTML = '<div class="empty">\u041e\u0442\u0437\u044b\u0432\u043e\u0432 \u043f\u043e\u043a\u0430 \u043d\u0435\u0442</div>';
      return;
    }

    if (reviewsList) {
      reviewsList.innerHTML = reviews.map((review) => {
        const stars = '&#9733;'.repeat(Math.max(1, Math.min(5, Number(review.rating || 0))));
        return '<article class="review">' +
          '<div class="review-head">' +
            '<div>' +
              '<div class="review-author">' + escapeHtml(review.authorName || '\u041f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044c') + '</div>' +
              '<div class="review-route">' + escapeHtml(review.loadRoute || '') + '</div>' +
            '</div>' +
            '<div class="rating">' + stars + ' <span style="color:#94a3b8;font-size:12px">' + escapeHtml(formatDate(review.createdAt)) + '</span></div>' +
          '</div>' +
          (review.text ? '<p class="review-text">' + escapeHtml(review.text) + '</p>' : '') +
        '</article>';
      }).join('');
    }
  } catch (err) {
    console.error('User profile error:', err);
    if (reviewsList) reviewsList.innerHTML = '<div class="empty">' + escapeHtml(err.message || '\u041e\u0448\u0438\u0431\u043a\u0430 \u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0438') + '</div>';
  }
}

document.addEventListener('DOMContentLoaded', initUserProfile);

</script>
</body>
</html>
